<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>NEON COURIER</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  html,body{margin:0;height:100%;background:#05050c;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center}
  canvas{image-rendering:pixelated;image-rendering:crisp-edges;background:#000;box-shadow:0 0 50px #00f0ff33}
</style>
</head>
<body>
<canvas id="c" width="480" height="272"></canvas>
<script>
'use strict';
/* =====================================================================
   NEON COURIER  -  a cyberpunk pixel-art platformer (single file, no libs)

   Controls
     Move ........ ARROWS / A D
     Jump ........ SPACE / Z / W / UP   (hold = higher, press again in air = double jump)
     Dash ........ X / SHIFT / K        (air or ground, breaks enemies, invulnerable)
     Pause ....... P / ESC      Mute ... M      Confirm ... ENTER      Lighting FX on/off ... G

   Code map
     1  constants & tuning        8  level builder + the 3 levels
     2  utils                     9  collision
     3  input                    10  entities (player, enemies, platforms, boss)
     4  audio (SFX + music)      11  particles / camera
     5  pixel font               12  game flow (states, respawn, transitions)
     6  themes & backgrounds     13  rendering
     7  tile renderer            14  fixed-timestep main loop
   ===================================================================== */

/* ---------- 1. CONSTANTS & TUNING ---------- */
const W = 480, H = 272, T = 16;        // internal resolution and tile size
const STEP = 1 / 60;                   // fixed simulation step (seconds)

// All feel parameters live here so they are easy to tweak.
const PHYS = {
  runSpeed: 128, accelGround: 1500, accelAir: 1000, frictionGround: 1700, frictionAir: 380,
  gravity: 1100, maxFall: 420,
  jumpV: -325, djumpV: -290,
  coyote: 0.10,            // grace time to jump after leaving a ledge
  buffer: 0.12,            // jump pressed slightly before landing still counts
  cutGravityMul: 2.6,      // extra gravity when jump released early (variable height)
  hangMul: 0.55,           // reduced gravity at the apex while jump is held
  dashSpeed: 310, dashTime: 0.16, dashCooldown: 0.35,
  maxHp: 3, invuln: 1.3
};

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d', { alpha: false });
ctx.imageSmoothingEnabled = false;

// Scale the canvas to the window (integer scale when it fits, to keep pixels crisp).
function fit() {
  let s = Math.min(innerWidth / W, innerHeight / H);
  s = s >= 1 ? Math.floor(s) : s;
  canvas.style.width = Math.floor(W * s) + 'px';
  canvas.style.height = Math.floor(H * s) + 'px';
}
addEventListener('resize', fit); fit();

/* ---------- 2. UTILS ---------- */
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const rnd = (a, b) => a + Math.random() * (b - a);
const approach = (v, t, d) => v < t ? Math.min(v + d, t) : Math.max(v - d, t);
const overlap = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
function mulberry(seed) { // small seeded RNG so backgrounds are stable
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hex(c) { return [parseInt(c.slice(1, 3), 16), parseInt(c.slice(3, 5), 16), parseInt(c.slice(5, 7), 16)]; }
function mix(a, b, t) { const A = hex(a), B = hex(b); return 'rgb(' + A.map((v, i) => Math.round(v + (B[i] - v) * t)).join(',') + ')'; }
function mk(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }

/* ---------- 3. INPUT ---------- */
const Input = (() => {
  const map = {
    left: ['ArrowLeft', 'KeyA'], right: ['ArrowRight', 'KeyD'],
    jump: ['Space', 'KeyZ', 'ArrowUp', 'KeyW', 'KeyC'],
    dash: ['KeyX', 'ShiftLeft', 'ShiftRight', 'KeyK'],
    confirm: ['Enter'], pause: ['KeyP', 'Escape'], mute: ['KeyM'], fx: ['KeyG']
  };
  const codeAct = {}; for (const a in map) for (const c of map[a]) (codeAct[c] = codeAct[c] || []).push(a);
  const held = new Set(), hit = {};
  addEventListener('keydown', e => {
    if (codeAct[e.code]) e.preventDefault();
    if (e.repeat) return;
    held.add(e.code); (codeAct[e.code] || []).forEach(a => hit[a] = true);
    Sound.init();
  });
  addEventListener('keyup', e => held.delete(e.code));
  addEventListener('blur', () => held.clear());
  addEventListener('pointerdown', () => Sound.init());
  return { down: a => map[a].some(c => held.has(c)), hit, clear() { for (const k in hit) hit[k] = false; } };
})();

/* ---------- 4. AUDIO: procedural SFX + step-sequenced music ---------- */
const Sound = (() => {
  let ac = null, master, sfxG, musG, noiseBuf, muted = false, pendingTrack = null;
  const mtof = m => 440 * Math.pow(2, (m - 69) / 12);

  function init() {
    if (ac) { if (ac.state === 'suspended') ac.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    ac = new AC();
    master = ac.createGain(); master.gain.value = muted ? 0 : 0.7; master.connect(ac.destination);
    sfxG = ac.createGain(); sfxG.gain.value = 0.55; sfxG.connect(master);
    musG = ac.createGain(); musG.gain.value = 0.32; musG.connect(master);
    noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    setInterval(schedule, 25);
    if (pendingTrack) setTrack(pendingTrack);
  }
  function tone(f, dur, type, vol, slide, delay, dest) {
    if (!ac) return; const t = ac.currentTime + (delay || 0);
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type || 'square'; o.frequency.setValueAtTime(f, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(1, slide), t + dur);
    g.gain.setValueAtTime(vol == null ? 0.2 : vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(dest || sfxG); o.start(t); o.stop(t + dur + 0.03);
  }
  function noise(dur, vol, f0, f1, delay, type, dest) {
    if (!ac) return; const t = ac.currentTime + (delay || 0);
    const s = ac.createBufferSource(); s.buffer = noiseBuf;
    const fl = ac.createBiquadFilter(); fl.type = type || 'lowpass';
    fl.frequency.setValueAtTime(f0 || 2000, t); if (f1) fl.frequency.exponentialRampToValueAtTime(f1, t + dur);
    const g = ac.createGain(); g.gain.setValueAtTime(vol == null ? 0.3 : vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(fl); fl.connect(g); g.connect(dest || sfxG); s.start(t, Math.random() * 0.5, dur + 0.02);
  }
  const sfx = {
    jump() { tone(260, .14, 'square', .16, 560); },
    djump() { tone(400, .16, 'square', .15, 900); tone(600, .12, 'triangle', .1, 1200, .04); },
    dash() { noise(.18, .25, 3000, 400, 0, 'bandpass'); tone(500, .15, 'sawtooth', .08, 120); },
    land() { noise(.06, .15, 600, 200); },
    chip() { tone(880, .07, 'square', .14); tone(1320, .12, 'square', .14, null, .06); },
    repair() { [523, 659, 784, 1047].forEach((f, i) => tone(f, .1, 'triangle', .18, null, i * .06)); },
    hurt() { tone(200, .3, 'sawtooth', .25, 50); noise(.2, .25, 1500, 200); },
    stomp() { tone(180, .1, 'square', .25, 60); noise(.08, .2, 1200, 300); },
    kill() { noise(.28, .3, 2500, 200); tone(300, .2, 'square', .15, 60); },
    shoot() { tone(700, .12, 'sawtooth', .08, 200); },
    check() { [392, 523, 659].forEach((f, i) => tone(f, .14, 'square', .14, null, i * .07)); },
    crumble() { noise(.35, .25, 900, 100); },
    warn() { tone(900, .08, 'square', .08); },
    laser() { noise(.25, .15, 4000, 1200, 0, 'highpass'); tone(120, .25, 'sawtooth', .1, 90); },
    explode() { noise(.7, .4, 1800, 60); tone(90, .5, 'sawtooth', .25, 30); },
    bossHit() { noise(.4, .35, 2500, 100); tone(150, .4, 'square', .25, 40); tone(900, .2, 'triangle', .12, 200); },
    roar() { tone(70, 1.0, 'sawtooth', .3, 40); tone(73, 1.0, 'square', .15, 38); noise(.9, .2, 600, 80); },
    clear() { [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, .18, 'square', .15, null, i * .09)); },
    die() { tone(400, .6, 'sawtooth', .22, 40); noise(.5, .3, 2000, 80); },
    select() { tone(660, .08, 'square', .12); tone(990, .1, 'square', .12, null, .06); }
  };

  /* Music: each track = chord progression (one root per bar) + 16-step patterns.
     Bass, arpeggio, lead, pad and drums are all synthesized and scheduled ahead of time. */
  const TRACKS = {
    title: { bpm: 96, root: 45, prog: [0, -4, -7, -2], chord: [0, 3, 7, 12], arpOrder: [0, 1, 2, 3, 2, 1, 2, 1],
      bass: 'x..x..x.x..x..x.', arp: 'x.x.x.x.x.x.x.x.', kick: 'x.......x.......', snare: '....x.......x...', hat: '..x...x...x...x.',
      lead: [12, null, null, 15, null, 14, null, 12, null, null, 10, null, 12, null, null, null] },
    l1: { bpm: 118, root: 40, prog: [0, 0, -4, -2], chord: [0, 3, 7, 12], arpOrder: [0, 1, 2, 3, 2, 3, 2, 1],
      bass: 'x.xx.x.xx.xx.x.x', arp: 'xxxxxxxxxxxxxxxx', kick: 'x...x...x...x...', snare: '....x.......x...', hat: 'x.x.x.x.x.x.x.x.',
      lead: [null, null, 19, null, null, 22, null, 19, null, null, 17, null, 15, null, null, null] },
    l2: { bpm: 128, root: 38, prog: [0, 3, -2, -5], chord: [0, 3, 7, 10], arpOrder: [0, 2, 1, 3, 2, 3, 1, 2],
      bass: 'x.x.xx.xx.x.xx.x', arp: 'xxxxxxxxxxxxxxxx', kick: 'x..xx...x..xx...', snare: '....x.......x..x', hat: 'xxxxxxxxxxxxxxxx',
      lead: [24, null, 22, null, 19, null, null, 22, null, null, 24, null, 27, null, 24, null] },
    l3: { bpm: 138, root: 43, prog: [0, -2, -4, -7], chord: [0, 3, 6, 10], arpOrder: [0, 1, 2, 3, 3, 2, 1, 0],
      bass: 'xxx.xxx.xxx.xxx.', arp: 'xxxxxxxxxxxxxxxx', kick: 'x...x...x..xx...', snare: '....x...x...x..x', hat: 'x.xxx.xxx.xxx.xx',
      lead: [24, null, 27, 24, null, 22, null, 24, 27, null, 30, null, 27, null, 24, null] },
    boss: { bpm: 156, root: 36, prog: [0, 0, 1, -1], chord: [0, 3, 6, 9], arpOrder: [0, 1, 2, 3, 2, 3, 1, 2],
      bass: 'xxxxxxxxxxxxxxxx', arp: 'xxxxxxxxxxxxxxxx', kick: 'x.x.x.x.x.x.x.xx', snare: '....x.......x.x.', hat: 'xxxxxxxxxxxxxxxx',
      lead: [24, 24, null, 27, null, 24, 25, null, 24, null, 30, null, 29, null, 27, null] },
    win: { bpm: 104, root: 48, prog: [0, 5, 7, 0], chord: [0, 4, 7, 12], arpOrder: [0, 1, 2, 3, 2, 1, 2, 3],
      bass: 'x...x...x...x...', arp: 'x.x.x.x.x.x.x.x.', kick: 'x.......x.......', snare: '................', hat: '..x...x...x...x.',
      lead: [12, null, 16, null, 19, null, 24, null, 19, null, 16, null, 12, null, null, null] }
  };
  let cur = null, step = 0, nextT = 0;
  function setTrack(name) {
    pendingTrack = name; if (!ac) return;
    cur = name ? TRACKS[name] : null; step = 0; nextT = ac.currentTime + 0.08;
  }
  function schedule() {
    if (!ac || !cur || muted) { if (cur && ac) nextT = Math.max(nextT, ac.currentTime); return; }
    while (nextT < ac.currentTime + 0.12) { playStep(nextT, step); nextT += 60 / cur.bpm / 4; step++; }
  }
  function playStep(t, s) {
    const tr = cur, bar = Math.floor(s / 16) % tr.prog.length, i = s % 16, root = tr.root + tr.prog[bar], sd = 60 / tr.bpm / 4;
    if (tr.bass[i] === 'x') {
      const o = ac.createOscillator(), f = ac.createBiquadFilter(), g = ac.createGain();
      o.type = 'sawtooth'; o.frequency.value = mtof(root); f.type = 'lowpass'; f.frequency.setValueAtTime(700, t); f.frequency.exponentialRampToValueAtTime(180, t + sd);
      g.gain.setValueAtTime(0.5, t); g.gain.exponentialRampToValueAtTime(0.001, t + sd * 0.95);
      o.connect(f); f.connect(g); g.connect(musG); o.start(t); o.stop(t + sd);
    }
    if (tr.arp[i] === 'x') {
      const n = root + 24 + tr.chord[tr.arpOrder[i % 8]];
      const o = ac.createOscillator(), g = ac.createGain(); o.type = 'square'; o.frequency.value = mtof(n);
      g.gain.setValueAtTime(0.07, t); g.gain.exponentialRampToValueAtTime(0.001, t + sd * 0.8);
      o.connect(g); g.connect(musG); o.start(t); o.stop(t + sd);
    }
    const L = tr.lead[i];
    if (L != null) {
      const o = ac.createOscillator(), g = ac.createGain(); o.type = 'square'; o.frequency.value = mtof(tr.root + 24 + L + tr.prog[bar]);
      g.gain.setValueAtTime(0.09, t); g.gain.exponentialRampToValueAtTime(0.001, t + sd * 1.8);
      o.connect(g); g.connect(musG); o.start(t); o.stop(t + sd * 2);
    }
    if (i === 0) { // pad
      for (const k of [0, 7, 12]) {
        const o = ac.createOscillator(), f = ac.createBiquadFilter(), g = ac.createGain();
        o.type = 'sawtooth'; o.frequency.value = mtof(root + 24 + k); o.detune.value = k * 3 - 6; f.type = 'lowpass'; f.frequency.value = 900;
        g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(0.03, t + 0.2); g.gain.exponentialRampToValueAtTime(0.0001, t + sd * 15);
        o.connect(f); f.connect(g); g.connect(musG); o.start(t); o.stop(t + sd * 16);
      }
    }
    if (tr.kick[i] === 'x') { const o = ac.createOscillator(), g = ac.createGain(); o.frequency.setValueAtTime(150, t); o.frequency.exponentialRampToValueAtTime(40, t + 0.12);
      g.gain.setValueAtTime(0.7, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.15); o.connect(g); g.connect(musG); o.start(t); o.stop(t + 0.16); }
    if (tr.snare[i] === 'x') noise2(t, 0.14, 0.3, 1800, 'highpass');
    if (tr.hat[i] === 'x') noise2(t, 0.04, 0.12, 7000, 'highpass');
  }
  function noise2(t, dur, vol, f, type) {
    const s = ac.createBufferSource(); s.buffer = noiseBuf; const fl = ac.createBiquadFilter(); fl.type = type; fl.frequency.value = f;
    const g = ac.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    s.connect(fl); fl.connect(g); g.connect(musG); s.start(t, Math.random() * 0.5, dur + 0.02);
  }
  return {
    init, setTrack,
    play(n) { if (ac && !muted && sfx[n]) { try { sfx[n](); } catch (e) { } } },
    toggleMute() { muted = !muted; if (master) master.gain.value = muted ? 0 : 0.7; return muted; },
    get muted() { return muted; }
  };
})();

/* ---------- 5. PIXEL FONT (3x5, drawn with rects so it stays crisp) ---------- */
const FONT = {
  A: [2, 5, 7, 5, 5], B: [6, 5, 6, 5, 6], C: [3, 4, 4, 4, 3], D: [6, 5, 5, 5, 6], E: [7, 4, 6, 4, 7], F: [7, 4, 6, 4, 4],
  G: [3, 4, 5, 5, 3], H: [5, 5, 7, 5, 5], I: [7, 2, 2, 2, 7], J: [1, 1, 1, 5, 2], K: [5, 5, 6, 5, 5], L: [4, 4, 4, 4, 7],
  M: [5, 7, 7, 5, 5], N: [6, 5, 5, 5, 5], O: [2, 5, 5, 5, 2], P: [6, 5, 6, 4, 4], Q: [2, 5, 5, 7, 3], R: [6, 5, 6, 5, 5],
  S: [3, 4, 2, 1, 6], T: [7, 2, 2, 2, 2], U: [5, 5, 5, 5, 7], V: [5, 5, 5, 5, 2], W: [5, 5, 7, 7, 5], X: [5, 5, 2, 5, 5],
  Y: [5, 5, 2, 2, 2], Z: [7, 1, 2, 4, 7],
  0: [7, 5, 5, 5, 7], 1: [2, 6, 2, 2, 7], 2: [6, 1, 2, 4, 7], 3: [6, 1, 2, 1, 6], 4: [5, 5, 7, 1, 1], 5: [7, 4, 6, 1, 6],
  6: [3, 4, 7, 5, 7], 7: [7, 1, 2, 2, 2], 8: [7, 5, 7, 5, 7], 9: [7, 5, 7, 1, 6],
  '.': [0, 0, 0, 0, 2], ',': [0, 0, 0, 2, 4], ':': [0, 2, 0, 2, 0], '!': [2, 2, 2, 0, 2], '?': [6, 1, 2, 0, 2], '-': [0, 0, 7, 0, 0],
  '+': [0, 2, 7, 2, 0], '/': [1, 1, 2, 4, 4], '%': [5, 1, 2, 4, 5], "'": [2, 2, 0, 0, 0], '(': [1, 2, 2, 2, 1], ')': [4, 2, 2, 2, 4],
  '=': [0, 7, 0, 7, 0], '<': [1, 2, 4, 2, 1], '>': [4, 2, 1, 2, 4], '_': [0, 0, 0, 0, 7], ' ': [0, 0, 0, 0, 0]
};
// Draws text in SCREEN space. align: 'left' | 'center' | 'right'
function text(str, x, y, s, c, align, shadow) {
  str = String(str).toUpperCase(); s = s || 1;
  const w = str.length * 4 * s - s;
  if (align === 'center') x -= w / 2; else if (align === 'right') x -= w;
  x = Math.round(x); y = Math.round(y);
  const pass = (ox, oy, col) => {
    ctx.fillStyle = col;
    for (let k = 0; k < str.length; k++) {
      const g = FONT[str[k]]; if (!g) continue;
      for (let r = 0; r < 5; r++) for (let q = 0; q < 3; q++) if (g[r] & (4 >> q)) ctx.fillRect(x + ox + k * 4 * s + q * s, y + oy + r * s, s, s);
    }
  };
  if (shadow !== false) pass(s, s, '#000000aa');
  pass(0, 0, c || '#fff');
}

/* ---------- 6. THEMES & PARALLAX BACKGROUNDS ---------- */
const THEMES = {
  alley: { skyTop: '#1b0a3f', skyBot: '#8a1f78', sun: ['#ffe36b', '#ff2d95'], far: '#3a1a6e', mid: '#26104f', near: '#12082b',
    neon: ['#ff2d95', '#00f0ff', '#ffe600', '#b967ff'], tile: '#2e2a55', tileDark: '#1f1b3d', tileLight: '#403a73', edge: '#00f0ff', edgeGlow: '#7a6bd6', win: '#ffd36b' },
  foundry: { skyTop: '#04202a', skyBot: '#0d6a62', sun: ['#d8ff6b', '#1fdc8a'], far: '#0e4a4c', mid: '#093538', near: '#041d20',
    neon: ['#39ff88', '#ffb000', '#00e5ff', '#ff4f4f'], tile: '#2a3a3d', tileDark: '#1b2a2d', tileLight: '#3b5256', edge: '#39ff88', edgeGlow: '#4f7f7a', win: '#9bffb8' },
  tower: { skyTop: '#260610', skyBot: '#b02a1e', sun: ['#fff09a', '#ff3b1f'], far: '#5a1020', mid: '#3a0a16', near: '#1c0509',
    neon: ['#ff2244', '#ffaa00', '#ff00aa', '#ffe600'], tile: '#43232b', tileDark: '#2e151c', tileLight: '#5b323b', edge: '#ff2244', edgeGlow: '#a8505e', win: '#ffb27a' }
};

function skyline(th, seed, col, minH, maxH, minW, maxW, gapMax, winChance, baseY) {
  const Wl = 512, c = mk(Wl, H), g = c.getContext('2d'), rng = mulberry(seed), specs = [];
  let x = 0;
  while (x < Wl) {
    const bw = Math.floor(rnd(minW, maxW)), bh = Math.floor(rnd(minH, maxH));
    specs.push({ x, bw, bh, seed: Math.floor(rng() * 1e9) });
    x += bw + Math.floor(rnd(0, gapMax));
  }
  const draw = (s, ox) => {
    const r = mulberry(s.seed), x0 = s.x + ox, top = baseY - s.bh;
    g.fillStyle = col; g.fillRect(x0, top, s.bw, H - top);
    if (r() < 0.45) g.fillRect(x0 + (s.bw >> 1), top - 10, 1, 10);          // antenna
    if (r() < 0.3) { g.fillStyle = th.neon[(r() * 4) | 0]; g.fillRect(x0 + (s.bw >> 1), top - 11, 1, 1); }
    if (winChance) {
      for (let wy = top + 5; wy < baseY - 4; wy += 5) for (let wx = x0 + 3; wx < x0 + s.bw - 3; wx += 4) {
        if (r() < winChance) { g.fillStyle = r() < 0.7 ? th.win : th.neon[(r() * 4) | 0]; g.globalAlpha = 0.55; g.fillRect(wx, wy, 2, 2); g.globalAlpha = 1; }
      }
    }
    if (r() < 0.25) { g.fillStyle = th.neon[(r() * 4) | 0]; g.fillRect(x0 + s.bw - 3, top + 6, 2, 10 + ((r() * 24) | 0)); }
  };
  for (const s of specs) { draw(s, 0); if (s.x + s.bw > Wl) draw(s, -Wl); } // wrap so the layer tiles seamlessly
  return c;
}
function makeBackground(th, seed) {
  const rng = mulberry(seed), sky = mk(W, H), s = sky.getContext('2d');
  // Sky: many bands, with a checker-dither row pair between bands so the gradient reads as pixel art.
  const bands = 34, bh = H / bands, colAt = i => mix(th.skyTop, th.skyBot, Math.pow(i / (bands - 1), 0.8));
  for (let i = 0; i < bands; i++) {
    const y0 = Math.floor(i * bh), y1 = Math.floor((i + 1) * bh);
    s.fillStyle = colAt(i); s.fillRect(0, y0, W, y1 - y0 + 1);
    if (i < bands - 1) { s.fillStyle = colAt(i + 1); for (let y = y1 - 2; y < y1; y++) for (let x = (y & 1); x < W; x += 2) s.fillRect(x, y, 1, 1); }
  }

/* ---------- 7. TILE RENDERER (whole level pre-rendered once) ---------- */
function renderTiles(L) {
  const th = L.theme, c = mk(L.w * T, L.h * T), g = c.getContext('2d'), rng = mulberry(99);
  const sol = (x, y) => x < 0 || x >= L.w ? true : y < 0 || y >= L.h ? false : L.grid[y * L.w + x] === 1;

      } else if (variant < 6) { // riveted panel
        g.fillStyle = th.tileDark; g.fillRect(x, y, T, 1); g.fillRect(x, y + 15, T, 1); g.fillRect(x, y, 1, T); g.fillRect(x + 15, y, 1, T);
        g.fillStyle = th.tileLight; g.fillRect(x + 1, y + 1, 14, 1); g.fillRect(x + 1, y + 1, 1, 14);
        for (const [i, j] of [[3, 3], [12, 3], [3, 12], [12, 12]]) g.fillRect(x + i, y + j, 1, 1);
      } else { // grate
        g.fillStyle = th.tileDark; for (let j = 2; j < 15; j += 3) g.fillRect(x + 2, y + j, 12, 1);
        g.fillStyle = th.tileLight; for (let j = 3; j < 15; j += 3) g.fillRect(x + 2, y + j, 12, 1);
      }
      if (rng() < 0.3) { g.fillStyle = th.tileLight; g.fillRect(x + ((rng() * 14) | 0), y + ((rng() * 14) | 0), 2, 1); }
      if (depth > 0) { g.fillStyle = 'rgba(0,0,0,' + Math.min(0.55, depth * 0.12) + ')'; g.fillRect(x, y, T, T); } // darker the deeper it sits
      if (up && dn && rng() < 0.06) { g.fillStyle = th.neon[(rng() * 4) | 0]; g.fillRect(x + 4, y + 5, 4, 1); g.globalAlpha = 0.3; g.fillRect(x + 3, y + 4, 6, 3); g.globalAlpha = 1; }

/* ---------- 9. COLLISION ---------- */

/* ---------- 10. ENTITIES ---------- */
let player = null;

function updatePlayer(dt) {

/* -- THE BOSS: 3 phases (9 hp). Vulnerable only while stunned after a charge. -- */

}

  else if (s === 'lasers') {
    b.t = 1.9; const a = G.L.arena, pc = player.x + 5, offs = b.phase === 2 ? [-70, 0, 70] : [-80, -26, 26, 80], zs = [];
    for (const o of offs) zs.push({ x: clamp(pc + o + (b.phase === 3 ? rnd(-14, 14) : 0), a.x + 16, a.x + a.w - 16), t: 0, warn: 0.9, act: 0.45, hit: false });
    b.zones = zs; Sound.play('warn');
  } else if (s === 'summon') {

    for (const x of [a.x + 24, a.x + a.w - 36]) if (alive < 2) { const w = mkWalker(x, a.floor - 10); w.summoned = true; w.speed = 38; G.L.enemies.push(w); emit(x + 6, a.floor - 6, 14, { c: '#ff3355', s: 80, life: .6 }); alive++; }

  emit(b.x + 22, b.y + 20, 30, { c: '#ffd84a', s: 160, life: .8 }); emit(b.x + 22, b.y + 20, 14, { c: '#fff', s: 100, life: .5 });

function updateBoss(dt) {
